name: Factory Security Baseline

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-manifests:
    name: Validate model manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('.').rglob('*.json'))
          if not files:
              raise SystemExit('No JSON manifests found')
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'PASS: {path}')
          PY

  factory-toolchain:
    name: Factory shared static toolchain
    uses: sokfrut-tech/Universal-AI-Factory/.github/workflows/factory-security-reusable.yml@61ad35797240295f280b50c68915539a06b94b9b
    permissions:
      contents: read
